<!DOCTYPE html>

    <title>Live demo af indlejret Vidi-kort</title>
    <script src="https://geofa-kort.geodanmark.dk/js/embed.js"></script>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      data-vidi-token="eyJpZCI6IiIsImhvc3QiOiJodHRwczovL2dlb2ZhLWtvcnQuZ2VvZGFubWFyay5kayIsImRhdGFiYXNlIjoiZmtnIiwiY29uZmlnIjoiL2FwaS92Mi9jb25maWd1cmF0aW9uL2ZrZy9jb25maWd1cmF0aW9uX2ZrZ191ZGdpdmV0XzVmNDY1ZjVkMzE4MWY2ODczNTMyNjAuanNvbiJ9"

      data-vidi-tmpl="embed.tmpl"
      data-vidi-use-config="true"
      data-vidi-signin="none"
      data-vidi-frame-name="geofa"
      data-vidi-title="Live demo af indlejret Vidi-kort"

    <script>
      // Når Vidi er klar: tænd to lag og zoom ind på Aarhus.
      // Lagene tændes lidt efter, fordi lagstyringen først skal være indlæst.
      embedApi.vidiReady["geofa"] = function () {
        setTimeout(function () {
          embedApi.switchLayer("fkg.t_6800_parl_fl", true, "geofa");
          embedApi.switchLayer("fkg_foto_gpx_link.t_5800_fac_pkt", true, "geofa");
          setTimeout(function () {
            embedApi.setView([56.142, 10.170], 12, "geofa");
          }, 1000);
        }, 2000);
      };
    </script>
  </body>
